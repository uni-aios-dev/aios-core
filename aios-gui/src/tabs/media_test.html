<pre id="status">Waiting for media events…</pre>
<script>
const status = document.getElementById('status');
const line = (text) => { status.textContent += '\n' + text; };
const audio = document.getElementById('audio');
const video = document.getElementById('video');
audio.addEventListener('playing', () => line('audio: playing'));
video.addEventListener('playing', () => line('video: playing'));
video.addEventListener('error', () => line('video: source unavailable (check network)'));
document.getElementById('play').onclick = async () => {
  try { await audio.play(); line('audio: play() accepted'); }
  catch (e) { line('audio: play() blocked — ' + e.message); }
};
document.getElementById('unmute').onclick = async () => {
  video.muted = false;
  try { await video.play(); line('video: unmuted playback started'); }
  catch (e) { line('video: play() blocked — ' + e.message); }
};
</script>
