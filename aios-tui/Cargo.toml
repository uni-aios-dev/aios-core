[package]
name = "aios-tui"
version = "1.0.0"
edition = "2021"

[dependencies]
aios-core = { path = "../aios-core" }
aios-hal = { path = "../aios-hal" }
aios-block-mgr = { path = "../aios-block-mgr" }
aios-process-mgr = { path = "../aios-process-mgr" }
aios-watchdog = { path = "../aios-watchdog" }
aios-context = { path = "../aios-context" }
aios-browser = { path = "../aios-browser" }
aios-webview = { path = "../aios-webview" }
aios-store = { path = "../aios-store" }
aios-net-config = { path = "../aios-net-config" }
aios-bridge = { path = "../aios-bridge" }
serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
env_logger = { workspace = true }
ratatui = { workspace = true }
crossterm = { workspace = true }
reqwest = { version = "0.12", features = ["blocking"] }
url = "2"
sha2 = { workspace = true }
hex = { workspace = true }
base64 = "0.22"

[[bin]]
name = "aios-tui"
path = "src/main.rs"

[dev-dependencies]
