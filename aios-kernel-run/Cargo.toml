# aios-kernel-run: host tool that builds the aios-kernel ELF, wraps it into a
# bootable Limine ISO (BIOS + UEFI) and launches it in QEMU.
#
# Standalone crate (NOT a workspace member): it shells out to a separate cargo
# invocation for the no_std kernel and must not disturb the stable host build.

[package]
name = "aios-kernel-run"
version = "0.2.0"
edition = "2021"
description = "AIOS kernel build/run tool: builds aios-kernel, creates a Limine bootable ISO, boots it in QEMU"

[dependencies]
