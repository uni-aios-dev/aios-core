[package]
name = "aios-autohal"
version = "1.0.0"
edition = "2021"

[dependencies]
aios-core = { path = "../aios-core" }
aios-hal = { path = "../aios-hal" }
aios-security = { path = "../aios-security" }
aios-wasm = { path = "../aios-wasm" }
serde = { workspace = true }
serde_json = { workspace = true }
bincode = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
log = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
libc = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "charset", "http2", "system-proxy", "json"] }
ratatui = { workspace = true, optional = true }
egui = { workspace = true, optional = true }

[dev-dependencies]
tempfile = "3"

[features]
default = ["tui", "gui"]
tui = ["dep:ratatui"]
gui = ["dep:egui"]
