[package]
name = "aios-daemon"
version = "1.0.0"
edition = "2021"
description = "Headless AIOS daemon for Docker/server deployment"

[dependencies]
aios-core = { path = "../aios-core" }
aios-hal = { path = "../aios-hal" }
aios-block-mgr = { path = "../aios-block-mgr" }
aios-process-mgr = { path = "../aios-process-mgr" }
aios-watchdog = { path = "../aios-watchdog" }
aios-context = { path = "../aios-context" }
log = { workspace = true }
env_logger = { workspace = true }

[[bin]]
name = "aiosd"
path = "src/main.rs"

[dev-dependencies]
