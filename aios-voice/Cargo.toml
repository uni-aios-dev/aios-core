[package]
name = "aios-voice"
version = "0.1.0"
edition = "2021"
description = "Microphone capture, speech recognition and voice pipeline state machine for AIOS"

[dependencies]
aios-core = { path = "../aios-core" }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["sync", "time", "rt"] }
log = { workspace = true }
cpal = "0.15"
hound = "3.5"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "charset", "http2", "multipart"] }
candle = { package = "candle-core", version = "0.11" }
candle-nn = "0.11"
candle-transformers = "0.11"
tokenizers = "0.23"

[dev-dependencies]
tempfile = "3"
