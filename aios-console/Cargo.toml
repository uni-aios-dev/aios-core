[package]
name = "aios-console"
version = "1.0.0"
edition = "2021"
description = "Single text-only command console for AIOS: registry, parser, capability gating, backends"

[features]
default = ["std"]
std = [
    "dep:aios-core",
    "dep:aios-context",
    "dep:aios-autohal",
    "dep:aios-hal",
    "dep:aios-ipc",
    "dep:aios-live-update",
    "dep:aios-block-mgr",
    "dep:aios-process-mgr",
    "dep:aios-net-config",
    "dep:aios-store",
    "dep:aios-vfs",
    "dep:aios-debug",
    "dep:aios-exec-compat",
    "dep:aios-iommu",
    "dep:aios-mpk",
    "dep:aios-security",
    "dep:aios-sys-control",
    "dep:aios-tee",
    "dep:aios-telemetry",
    "dep:aios-wasm",
    "dep:serde_json",
]

[dependencies]
aios-core = { path = "../aios-core", optional = true }
aios-context = { path = "../aios-context", optional = true }
aios-autohal = { path = "../aios-autohal", optional = true, default-features = false }
aios-hal = { path = "../aios-hal", optional = true }
aios-ipc = { path = "../aios-ipc", optional = true }
aios-live-update = { path = "../aios-live-update", optional = true }
aios-block-mgr = { path = "../aios-block-mgr", optional = true }
aios-process-mgr = { path = "../aios-process-mgr", optional = true }
aios-net-config = { path = "../aios-net-config", optional = true }
aios-store = { path = "../aios-store", optional = true }
aios-vfs = { path = "../aios-vfs", optional = true }
aios-debug = { path = "../aios-debug", optional = true }
aios-exec-compat = { path = "../aios-exec-compat", optional = true }
aios-iommu = { path = "../aios-iommu", optional = true }
aios-mpk = { path = "../aios-mpk", optional = true }
aios-security = { path = "../aios-security", optional = true }
aios-sys-control = { path = "../aios-sys-control", optional = true }
aios-tee = { path = "../aios-tee", optional = true }
aios-telemetry = { path = "../aios-telemetry", optional = true }
aios-wasm = { path = "../aios-wasm", optional = true }
serde_json = { workspace = true, optional = true }
