[package]
name = "aios-console"
version = "1.0.0"
edition = "2021"
description = "Single text-only command console for AIOS: registry, parser, capability gating, backends"

[features]
default = ["std"]
std = [
    "dep:aios-core",
    "dep:aios-context",
    "dep:aios-block-mgr",
    "dep:aios-process-mgr",
    "dep:aios-net-config",
    "dep:aios-store",
    "dep:aios-vfs",
    "dep:serde_json",
]

[dependencies]
aios-core = { path = "../aios-core", optional = true }
aios-context = { path = "../aios-context", optional = true }
aios-block-mgr = { path = "../aios-block-mgr", optional = true }
aios-process-mgr = { path = "../aios-process-mgr", optional = true }
aios-net-config = { path = "../aios-net-config", optional = true }
aios-store = { path = "../aios-store", optional = true }
aios-vfs = { path = "../aios-vfs", optional = true }
serde_json = { workspace = true, optional = true }
