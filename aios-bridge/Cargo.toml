[package]
name = "aios-bridge"
version = "1.0.0"
edition = "2021"

[dependencies]
aios-core = { path = "../aios-core" }
aios-security = { path = "../aios-security" }
aios-context = { path = "../aios-context" }
aios-process-mgr = { path = "../aios-process-mgr" }
aios-watchdog = { path = "../aios-watchdog" }
aios-block-mgr = { path = "../aios-block-mgr" }
serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1", features = ["full"] }
axum = { version = "0.7", features = ["ws"] }
tower-http = { version = "0.5", features = ["cors", "fs"] }
futures = "0.3"
aios-llm = { path = "../aios-llm" }
aios-browser = { path = "../aios-browser" }
aios-search = { path = "../aios-search" }
aios-store = { path = "../aios-store" }
aios-telemetry = { path = "../aios-telemetry" }
aios-debug = { path = "../aios-debug" }
base64 = "0.22"
sha2 = { workspace = true }
hex = { workspace = true }

[dev-dependencies]
tempfile = "3"
