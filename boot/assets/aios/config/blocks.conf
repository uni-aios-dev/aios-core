# WebAssembly block policy.
#
# This file is NOT listed in \aios\boot.conf: aios-boot discovers every
# `*.conf` in \aios\config and every `*.wasm` in \aios\blocks, so the serial log
# proves both the drop-in and the block discovery path:
#
#   [serial] [block] blocks/hello.wasm: hello from aios-wasmhost
#
# `blocks.<name>.rights` is a comma-separated subset of `log`, `exit`, `clock`
# and `yield`; a block gets no host access when the key is absent.
# `blocks.<name>.fuel` caps the instructions the block may spend (the runtime
# default is 100000).

blocks.hello.rights = log
blocks.hello.fuel = 20000
