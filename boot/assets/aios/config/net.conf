# Drop-in configuration for the network stack.
#
# This file is deliberately NOT listed in \aios\boot.conf: aios-boot discovers
# every `*.conf` file in \aios\config, so dropping it onto the ESP is enough to
# boot it. The kernel logs each key together with the layer it came from, so the
# serial log proves the drop-in was picked up:
#
#   [serial] [cfg] net.dhcp = "true" (config/net.conf, informational)
#
# All keys below are informational/validation-only in the bare-metal kernel:
# `net.dhcp` and `net.mtu` are parsed and checked but do not currently change
# DHCP or MTU behavior. The kernel's own link configuration is compile-time.

net.dhcp = true
net.hostname = aios
net.mtu = 1500
