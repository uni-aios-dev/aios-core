# AIOS system configuration.
#
# This is the base layer. The loader hands every `*.conf` file in \aios\config
# to the kernel as a MODULE_CONFIG module; the kernel parses them in place and
# the last layer wins, so a drop-in such as net.conf can override any key here
# without editing this file.
#
# Key policy (also printed in the serial log):
#   system.*, boot.*, net.* — informational/validation-only: parsed, validated
#   and logged with their source, but not applied as runtime knobs.
#   blocks.<name>.rights / .fuel — effective: consumed by the WASM host.
# The release version comes from aios-kernel/Cargo.toml via CARGO_PKG_VERSION.
# TIMER_HZ and HEAP_SIZE are compile-time constants and have no config keys.

system.name = AIOS
system.arch = x86_64

boot.console = serial
boot.framebuffer = gop
boot.debug = false
