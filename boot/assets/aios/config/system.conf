# AIOS system configuration.
#
# Deliberately minimal for M1: the kernel only reports which modules the loader
# handed over. Values are read by the configuration layer in M2.

system.name = AIOS
system.version = 0.1.0
system.arch = x86_64

boot.console = serial
boot.framebuffer = gop
boot.debug = false

scheduler.tick_hz = 100
memory.heap_min_kib = 4096
