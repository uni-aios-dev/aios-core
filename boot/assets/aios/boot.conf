# AIOS boot configuration, read by aios-boot.
#
# kernel — the ELF image the loader jumps to.
# module — a configuration file handed to the kernel as MODULE_CONFIG.
# block  — a WebAssembly block handed to the kernel as MODULE_BLOCK.
# raw    — opaque data handed to the kernel as MODULE_RAW.

kernel = /aios/kernel.elf
module = /aios/config/system.conf
block  = /aios/blocks/empty.wasm
