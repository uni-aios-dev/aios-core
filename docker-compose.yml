services:
  aios:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aios-docker
    environment:
      - RUST_LOG=info
      - AIOS_DATA_DIR=/app/data
      - AIOS_BLOCKS_DIR=/app/blocks
      - AIOS_MOCK_PROFILE=modern
    volumes:
      - aios-data:/app/data
      - aios-blocks:/app/blocks
    restart: unless-stopped

  aios-safe-mode:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aios-safe-mode
    environment:
      - RUST_LOG=debug
      - AIOS_SAFE_MODE=1
      - AIOS_MOCK_PROFILE=legacy
    volumes:
      - aios-data:/app/data
    profiles:
      - safe-mode

volumes:
  aios-data:
  aios-blocks:
