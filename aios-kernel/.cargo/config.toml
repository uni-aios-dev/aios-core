[target.x86_64-unknown-none]
rustflags = [
    "-C", "link-arg=-Tlinker.ld",
    "-C", "link-arg=--gc-sections",
    "-C", "codegen-units=1",
]
linker = "C:/tmp/ld_wrapper.cmd"

[target.x86_64-pc-windows-gnu]
rustflags = [
    "-C", "link-arg=-Tlinker.ld",
    "-C", "link-arg=--gc-sections",
    "-C", "codegen-units=1",
]
linker = "C:/tmp/ld_wrapper.cmd"
