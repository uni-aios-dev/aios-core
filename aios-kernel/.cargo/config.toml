# Bare-metal target: let rustc drive the linker bundled with the toolchain
# (rust-lld with the target's default `ld.lld` flavor). No system toolchain
# and no absolute paths: the build is reproducible on any host. `build.rs`
# passes the absolute path of `linker.ld`, so the crate does not depend on the
# linker's working directory either.
[target.x86_64-unknown-none]
rustflags = [
    "-C", "link-arg=--gc-sections",
    "-C", "codegen-units=1",
    "-C", "relocation-model=static",
]

# Host target (used only to compile/run the build script). Left to rustc's
# default MinGW `gcc` linker; the bare-metal linker script must NOT be applied
# here or the host executable would be emitted as a bare ELF.
