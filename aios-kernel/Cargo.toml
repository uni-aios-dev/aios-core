# aios-kernel: the real AIOS kernel (x86_64, no_std, freestanding).
#
# Standalone crate (NOT a workspace member) on purpose: it targets
# `x86_64-unknown-none` and is built with `cargo build --target x86_64-unknown-none`,
# so it must not be part of the host workspace profile/target setup.
# It is booted by the sibling `aios-boot` UEFI loader through the shared
# `aios-bootinfo` contract (see boot/aios-bootinfo) and linked with linker.ld.

[package]
name = "aios-kernel"
version = "0.3.0"
edition = "2021"
description = "AIOS standalone bare-metal kernel (x86_64, no_std) — aios-boot hand-off + UEFI GOP framebuffer"

[dependencies]
aios-bootinfo = { path = "../boot/aios-bootinfo" }

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
opt-level = 2
lto = false
