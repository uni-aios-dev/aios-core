set timeout=10
set default=0

menuentry "AIOS Live" {
  linux /boot/vmlinuz quiet
  initrd /boot/initramfs.gz
}

menuentry "AIOS Live (verbose console)" {
  linux /boot/vmlinuz
  initrd /boot/initramfs.gz
}

menuentry "AIOS Installer (install to disk)" {
  linux /boot/vmlinuz quiet
  initrd /boot/initramfs.gz
}
