# AIOS installer block selection.
#
# One block name per line (the `{name}` part of
# `/usr/share/aios/blocks/{name}_{version}.wasm`), or a single keyword:
#   all  — install every block found in the catalog (default)
#   none — install no optional blocks
# Comments (#) and blank lines are ignored.
#
# This is the *default* selection. The installer lets the user override it
# interactively, and the final choice is written to /etc/aios/blocks.conf on
# the installed system.
#
# The compiled-in base set (hal, browser, net_settings, ipc_bus, scheduler)
# lives in the kernel binary and must not be listed here.
all
